name = "solo-empire-jobs"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
# @sentry/cloudflare needs AsyncLocalStorage.
compatibility_flags = ["nodejs_als"]
workers_dev = true

# The account comes from CLOUDFLARE_ACCOUNT_ID (Infisical /cloudflare).

# One every-minute trigger; src/cron.ts matches each job's own schedule (Workers Free allows only
# 5 cron triggers per account, and the uptime Worker uses 2).
[triggers]
crons = ["* * * * *"]

# ADR-0008 queue plane. Created once with:
#   wrangler queues create jobs && wrangler queues create jobs-dlq
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "jobs"

# Bound to read the DLQ backlog for /healthz.
[[queues.producers]]
binding = "JOBS_DLQ"
queue = "jobs-dlq"

[[queues.consumers]]
queue = "jobs"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 5
dead_letter_queue = "jobs-dlq"

# Worker secrets are never stored in this file; set them with `wrangler secret put`:
#   JOBS_TOKEN             required for POST /enqueue (Infisical /jobs)
#   GITHUB_DISPATCH_TOKEN  required for github_workflow jobs (Actions: write on the target repos)
#   GATEWAY_TOKEN          optional, bearer for http jobs routed through the API gateway
#   SENTRY_DSN             optional, error reporting (unset = off)

# Parked jobs: never run again here. Each is checked after half its age (15 min to 6 h) and acked
# once a later queue-dispatched run of the same workflow succeeded, or a newer scheduled slot of the
# job is over 1 h old (it carries the alert); until then it stays and /healthz answers 503.
# A copy whose next recheck would land past 18 h of age is re-sent to jobs-dlq (retention 24 h on Free), so
# a job only leaves when it is resolved. max_retries is only a backstop.
# Before `wrangler rollback` to a version without this consumer, remove it first
# (`wrangler queues consumer remove jobs-dlq solo-empire-jobs`) or the old code would run parked jobs.
[[queues.consumers]]
queue = "jobs-dlq"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 100
